      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("canon.theme.v2");
          var bgMap = {
            elysium: ["#07090F", "dark"],
            alabaster: ["#F6F5F0", "light"]
          };
          var t = saved && bgMap[saved] ? saved : "elysium";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = bgMap[t][1];
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bgMap[t][0]);

          var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          var eff = conn && conn.effectiveType ? String(conn.effectiveType).toLowerCase() : "";
          var netType = conn && conn.type ? String(conn.type).toLowerCase() : "";
          var dl = conn && typeof conn.downlink === "number" ? conn.downlink : 10;
          var saver = Boolean(
            conn &&
              (conn.saveData === true ||
                eff === "slow-2g" ||
                eff === "2g" ||
                eff === "3g" ||
                (netType === "cellular" && dl > 0 && dl < 2.8) ||
                (dl > 0 && dl < 1.4))
          );
          document.documentElement.dataset.netTier = saver ? "saver" : "full";

          var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var hasBlur =
            !window.CSS ||
            !window.CSS.supports ||
            window.CSS.supports("backdrop-filter", "blur(2px)") ||
            window.CSS.supports("-webkit-backdrop-filter", "blur(2px)");
          var cores = typeof navigator.hardwareConcurrency === "number" ? navigator.hardwareConcurrency : 8;
          var mem = typeof navigator.deviceMemory === "number" ? navigator.deviceMemory : 8;
          var gfxTier = "full";
          if (reduced || !hasBlur) {
            gfxTier = "lite";
          } else if (saver || (cores > 0 && cores <= 2) || (mem > 0 && mem <= 1)) {
            gfxTier = "balanced";
          }
          document.documentElement.dataset.gfxTier = gfxTier;

          if (!reduced && hasBlur) {
            var isMobile = window.matchMedia("(max-width: 767px)").matches;
            var preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "image";
            preload.type = "image/avif";
            preload.setAttribute("fetchpriority", "high");
            var srcsetVal = "";
            var sizesVal = "100vw";
            if (saver) {
              srcsetVal = isMobile ? "/yoyo/mobile-360w.avif 360w" : "/yoyo/desktop-640w.avif 640w";
              sizesVal = isMobile ? "360px" : "640px";
            } else if (isMobile) {
              srcsetVal =
                "/yoyo/mobile-360w.avif 360w, /yoyo/mobile-540w.avif 540w, /yoyo/mobile-768w.avif 768w, /yoyo/mobile-1152w.avif 1152w";
            } else {
              srcsetVal =
                "/yoyo/desktop-640w.avif 640w, /yoyo/desktop-1024w.avif 1024w, /yoyo/desktop-1376w.avif 1376w, /yoyo/desktop-2064w.avif 2064w";
            }
            preload.setAttribute("imagesrcset", srcsetVal);
            preload.setAttribute("imagesizes", sizesVal);
            document.head.appendChild(preload);
          }
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">

  </body>
