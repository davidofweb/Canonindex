name: CANON Zero-VPS Keeper Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keeper-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Simulate & execute CANON fee route + Vault rebalance
        env:
          VITE_RPC_URL: ${{ vars.ELYSIUM_RPC || 'https://testnet-rpc.elysium.kinetiq.xyz' }}
          CANON_DEPLOYMENT_JSON: ${{ secrets.CANON_DEPLOYMENT_JSON }}
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
        run: npm run keeper:once
